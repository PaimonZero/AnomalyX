services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anomalyx}
      POSTGRES_USER: ${POSTGRES_USER:-anomalyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to point at model artifacts mounted from the ml/ folder
      MODEL_PATH: /app/ml/models/artifacts/xgb_aml_v1.json
      MODEL_CONFIG_PATH: /app/ml/models/artifacts/model_config.json
      # Infra endpoints inside Docker network
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-anomalyx}
      POSTGRES_USER: ${POSTGRES_USER:-anomalyx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anomalyx_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-anomalyx}
      REDIS_URL: redis://redis:6379/0
      ALERT_REPOSITORY: postgres
      IDEMPOTENCY_STORE: redis
      API_HOST: 0.0.0.0
    volumes:
      # Mount model artifacts so they're accessible inside the container
      - ./ml/models/artifacts:/app/ml/models/artifacts:ro
      # Mount active rules so the backend can load /configs/rules.yaml and hot-reload it
      - ./configs:/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
